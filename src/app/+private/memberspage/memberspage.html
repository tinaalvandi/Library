<my-crud
 [mystate]="state"
 [column]="membersCulomns"
 [mydata]="data"
 (onAdd)="add()"
 (onCancel)="cancel()"
 (onEdit)="edit($event)"
(onRemove)="remove($event)"
(onSave)="save()"
 >
        <div>
        <input [disabled]="state=='edit'||state=='remove'" [class.ghogl]="state=='edit'" [(ngModel)]="item.id" id="id" name="id" type="number" placeholder="شناسه کتاب">
    </div>
    <div>
        <input [disabled]="state=='remove'" [(ngModel)]="item.fullname" id="fullname" name="fullname" type="text" placeholder=" نام و نام خانوادگی">
    </div>
    <div>
        <input [disabled]="state=='remove'" [(ngModel)]="item.address" id="address" name="address" type="text" placeholder="آدرس">
    </div>
    <div>
        <input [disabled]="state=='remove'" [(ngModel)]="item.mobile" id="mobile" name="mobile" type="text" placeholder=" موبایل">
    </div>
</my-crud>
